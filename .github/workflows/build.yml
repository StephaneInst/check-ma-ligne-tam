name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.2.${{ github.run_number }}"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK (une release numérotée par version, pour Obtainium)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MaLigneTaM.apk
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create "v$APP_VERSION" MaLigneTaM.apk --latest \
            --title "Ma ligne TaM $APP_VERSION" \
            --notes "Version $APP_VERSION, compilée automatiquement depuis le commit ${GITHUB_SHA::7}. Télécharge MaLigneTaM.apk depuis ton téléphone et ouvre-le pour l'installer."

      - uses: actions/upload-artifact@v4
        with:
          name: MaLigneTaM-apk
          path: MaLigneTaM.apk
